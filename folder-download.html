<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保存飞书附件文件夹</title>
    <style>
      *{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f7;color:#1f2329}
      main{width:min(520px,calc(100% - 32px));margin:64px auto;padding:32px;border:1px solid #e5e6eb;border-radius:16px;background:#fff;text-align:center;box-shadow:0 12px 36px #1f232912}
      .icon{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 18px;border-radius:20px;background:#edf3ff;font-size:34px}
      h1{margin:0 0 10px;font-size:23px}p{margin:0 0 22px;color:#646a73;line-height:1.7}
      button{height:46px;padding:0 24px;border:0;border-radius:9px;background:#3370ff;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
      button:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;color:#245bdb;font-size:14px;white-space:pre-line}.error{color:#d83931}
    </style>
  </head>
  <body>
    <main>
      <div class="icon">📁</div>
      <h1>下载为真实文件夹</h1>
      <p>先选择保存位置。插件整理完成后，文件会直接写入你选择的文件夹，不会生成 ZIP。</p>
      <button id="choose">选择保存文件夹</button>
      <div id="status" class="status">正在等待飞书插件整理文件…</div>
    </main>
    <script>
      const jobId = new URLSearchParams(location.search).get('job')
      const button = document.querySelector('#choose')
      const status = document.querySelector('#status')
      let root = null
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('feishu-folder-downloads', 1)
          request.onupgradeneeded = () => request.result.createObjectStore('jobs')
          request.onsuccess = () => resolve(request.result)
          request.onerror = () => reject(request.error)
        })
      }
      async function readJob() {
        const db = await openDb()
        const value = await new Promise((resolve, reject) => {
          const request = db.transaction('jobs').objectStore('jobs').get(jobId)
          request.onsuccess = () => resolve(request.result)
          request.onerror = () => reject(request.error)
        })
        db.close()
        return value
      }
      async function removeJob() {
        const db = await openDb()
        const tx = db.transaction('jobs', 'readwrite')
        tx.objectStore('jobs').delete(jobId)
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve
          tx.onerror = () => reject(tx.error)
        })
        db.close()
      }
      async function writeFile(path, blob) {
        const parts = path.split('/').filter(Boolean)
        const filename = parts.pop()
        let directory = root
        for (const part of parts) directory = await directory.getDirectoryHandle(part, { create: true })
        const handle = await directory.getFileHandle(filename, { create: true })
        const writable = await handle.createWritable()
        await writable.write(blob)
        await writable.close()
      }
      async function begin() {
        try {
          if (!window.showDirectoryPicker) throw new Error('当前浏览器不支持直接写入文件夹，请使用最新版 Chrome 或 Edge。')
          root = await window.showDirectoryPicker()
          button.disabled = true
          status.textContent = '已选择文件夹，正在等待文件整理完成…'
          let job
          while (!(job = await readJob())) await wait(700)
          if (job.status === 'error') throw new Error(job.message || '插件整理文件失败')
          if (!job.files.length) throw new Error('没有找到可下载的非空附件或文字内容。')
          for (let index = 0; index < job.files.length; index += 1) {
            status.textContent = `正在写入 ${index + 1}/${job.files.length} 个文件…`
            await writeFile(job.files[index].path, job.files[index].blob)
          }
          await removeJob()
          status.textContent = `下载完成，共写入 ${job.files.length} 个文件。\n现在可以关闭此页面。`
        } catch (error) {
          button.disabled = false
          status.classList.add('error')
          status.textContent = error instanceof Error ? error.message : String(error)
        }
      }
      button.addEventListener('click', begin)
    </script>
  </body>
</html>
